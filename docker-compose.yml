# Payflow 웹 배포용 compose.
#
# 토폴로지: 브라우저 ─443─▶ [nginx] ──(payflow-net)──┬─▶ web:3000  (/)
#                                                     └─▶ api:8080  (/graphql, /events, /uploads, /upload)
# nginx·web·api 가 같은 외부 네트워크(payflow-net)에 있으면 컨테이너 이름으로 접근하므로
# web/api 는 호스트 포트를 열 필요가 없다. nginx 컨테이너만 80/443 publish.
#
# 사전 준비:
#   docker network create payflow-net      # 한 번만
#
# 필요한 변수(.env 또는 셸):
#   NEXT_PUBLIC_GRAPHQL_ENDPOINT   = https://payflow.clauminirockpt.me/graphql  (빌드 시 번들에 인라인)
#   NEXT_PUBLIC_KAKAO_MAPS_APP_KEY = 카카오맵 JS 키 (빌드 시 인라인)
#   AUTH_SECRET                    = Auth.js 세션 키 (서버 런타임)
#
#   docker compose build   # NEXT_PUBLIC_* 가 이 시점에 필요
#   docker compose up -d

networks:
  payflow-net:
    external: true

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_GRAPHQL_ENDPOINT: ${NEXT_PUBLIC_GRAPHQL_ENDPOINT}
        NEXT_PUBLIC_KAKAO_MAPS_APP_KEY: ${NEXT_PUBLIC_KAKAO_MAPS_APP_KEY}
    image: payflow-web:latest
    platform: linux/amd64
    restart: unless-stopped
    networks:
      - payflow-net
    # nginx 가 네트워크 내부에서 web:3000 으로 접근하므로 호스트 포트는 불필요.
    # nginx 없이 직접 띄워 확인하려면 아래 주석을 해제:
    #   ports: ["3000:3000"]
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_TRUST_HOST: ${AUTH_TRUST_HOST:-true}   # nginx(리버스 프록시) 뒤라 필수
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
