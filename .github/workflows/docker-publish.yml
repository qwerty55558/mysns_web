name: Build & Push (GHCR)

# develop/main 에 push 되면 amd64 이미지를 빌드해 GHCR 에 :latest 로 올린다.
# 수동 실행도 가능 (Actions 탭 → Run workflow).
on:
  push:
    branches: [develop, main]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/payflow-web

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # GHCR push 용 (GITHUB_TOKEN, PAT 불필요)
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push (linux/amd64, :latest)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:latest
          # NEXT_PUBLIC_* 는 빌드 시 번들에 인라인 → build arg 로 주입.
          #   NEXT_PUBLIC_GRAPHQL_ENDPOINT: repo Variable (없으면 운영 기본값)
          #   NEXT_PUBLIC_KAKAO_MAPS_APP_KEY: repo Secret (Settings → Secrets and variables → Actions)
          build-args: |
            NEXT_PUBLIC_GRAPHQL_ENDPOINT=${{ vars.NEXT_PUBLIC_GRAPHQL_ENDPOINT || 'https://payflow.clauminirockpt.me/graphql' }}
            NEXT_PUBLIC_KAKAO_MAPS_APP_KEY=${{ secrets.NEXT_PUBLIC_KAKAO_MAPS_APP_KEY }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
